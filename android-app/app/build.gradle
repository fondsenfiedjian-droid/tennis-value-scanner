plugins {
    id "com.android.application"
}

android {
    namespace "com.tennisvaluescanner.production"
    compileSdk 35

    defaultConfig {
        applicationId "com.tennisvaluescanner.production"
        minSdk 24
        targetSdk 34
        versionCode 201
        versionName "2.0.1"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
