name: Preview Winamax matching audit

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "worker.js"
      - "scripts/preview-odds-matching-audit.mjs"
      - ".github/workflows/preview-odds-matching-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit Preview Winamax-to-match linkage
        env:
          APP_URL: https://deploy-preview-167--fascinating-paprenjak-1aa9b3.netlify.app
          API_URL: https://tennis-value-api-preview.fonds-enfiedjian.workers.dev
        run: node scripts/preview-odds-matching-audit.mjs
