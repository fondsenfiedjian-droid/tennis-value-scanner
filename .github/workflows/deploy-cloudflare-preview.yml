name: Deploy Cloudflare Worker Preview

on:
  workflow_dispatch:
  push:
    branches:
      - ui/tennis-value-scanner-2

permissions:
  contents: read

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/ui/tennis-value-scanner-2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: ui/tennis-value-scanner-2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy isolated Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_PREVIEW_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          npx --yes wrangler@4.165.0 deploy --config wrangler.preview.toml

      - name: Smoke-check isolated Preview Worker and Live Tennis configuration
        env:
          PREVIEW_WORKER_URL: https://tennis-value-api-preview.fonds-enfiedjian.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.PREVIEW_WORKER_URL + "/health";
          const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
          if (!response.ok) throw new Error("Preview Worker health returned HTTP " + response.status);
          const health = await response.json();
          if (health.status !== "ok") throw new Error("Preview Worker health is not ok");
          if (health.liveTennisApiConfigured !== true) {
            throw new Error("Preview Worker is missing LIVE_TENNIS_API_KEY; player search and Elo comparison cannot work");
          }
          const endpoints = Array.isArray(health.endpoints) ? health.endpoints : [];
          if (!endpoints.some(endpoint => endpoint.startsWith("/players/search"))) {
            throw new Error("Preview Worker does not advertise /players/search");
          }
          if (!endpoints.includes("/predict")) throw new Error("Preview Worker does not advertise /predict");
          console.log("Preview Worker health OK; Live Tennis API configured; player search and Elo comparison routes advertised.");
          NODE

      - name: End-to-end player comparison smoke test (uses cached API reads)
        env:
          PREVIEW_WORKER_URL: https://tennis-value-api-preview.fonds-enfiedjian.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.PREVIEW_WORKER_URL;
          async function read(path, options) {
            const response = await fetch(base + path, { ...options, signal: AbortSignal.timeout(15000) });
            let payload = {};
            try { payload = await response.json(); } catch {}
            if (!response.ok) throw new Error("Preview comparison endpoint failed with HTTP " + response.status);
            return payload;
          }
          const [searchA, searchB] = await Promise.all([
            read("/players/search?search=Novak&limit=8"),
            read("/players/search?search=Carlos%20Alcaraz&limit=8")
          ]);
          const playerA = searchA.players?.find(player => player.name === "Novak Djokovic");
          const playerB = searchB.players?.find(player => player.name === "Carlos Alcaraz");
          if (!playerA || !playerB) throw new Error("Preview player search did not resolve both smoke-test players");
          const comparison = await read("/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              playerIdA: playerA.id, playerIdB: playerB.id,
              playerA: playerA.name, playerB: playerB.name, surface: "hard"
            })
          });
          const probabilityA = Number(comparison.probabilityA);
          const probabilityB = Number(comparison.probabilityB);
          if (!Number.isFinite(comparison.ratingA) || !Number.isFinite(comparison.ratingB) ||
              !Number.isFinite(probabilityA) || !Number.isFinite(probabilityB) ||
              Math.abs(probabilityA + probabilityB - 100) > 0.05) {
            throw new Error("Preview Elo comparison returned invalid ratings or probabilities");
          }
          const [historyA, historyB, h2h] = await Promise.all([
            read("/player-history?id=" + encodeURIComponent(playerA.id) + "&limit=20"),
            read("/player-history?id=" + encodeURIComponent(playerB.id) + "&limit=20"),
            read("/player-h2h?p1=" + encodeURIComponent(playerA.name) + "&p2=" + encodeURIComponent(playerB.name))
          ]);
          if (!Array.isArray(historyA.data) || !Array.isArray(historyB.data) ||
              !h2h.totals || !Array.isArray(h2h.meetings) ||
              h2h.players?.p1?.name !== playerA.name || h2h.players?.p2?.name !== playerB.name) {
            throw new Error("Preview comparison history or H2H payload failed validation");
          }
          console.log("End-to-end comparison OK: search, Elo, two Basic histories and Basic H2H.");
          NODE

      - name: Scanner schedule and Winamax feed smoke test
        env:
          PREVIEW_WORKER_URL: https://tennis-value-api-preview.fonds-enfiedjian.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.PREVIEW_WORKER_URL;
          async function read(path) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(15000) });
            if (!response.ok) throw new Error("Scanner source failed with HTTP " + response.status);
            return response.json();
          }
          const [schedule, odds] = await Promise.all([
            read("/matches?status=upcoming&draw=singles&limit=200"),
            read("/odds")
          ]);
          const scheduleRows = Array.isArray(schedule.data) ? schedule.data :
            Array.isArray(schedule.matches) ? schedule.matches : null;
          if (!scheduleRows) throw new Error("Schedule response has no recognized match array");
          if (!Array.isArray(odds.items)) throw new Error("Winamax odds response has no items array");
          if (!odds.diagnostics || !Number.isFinite(Number(odds.diagnostics.validDecimalOdds))) {
            throw new Error("Winamax odds diagnostics are missing or malformed");
          }
          const meta = schedule.meta || {};
          const hasMore = meta.has_more === true;
          const total = Number.isFinite(Number(meta.total)) ? Number(meta.total) : "unknown";
          const freshQuotes = Number.isFinite(Number(odds.diagnostics.freshScrapedAt))
            ? Number(odds.diagnostics.freshScrapedAt) : "unknown";
          console.log("Scanner sources OK: schedule rows=" + scheduleRows.length +
            "; schedule total=" + total + "; schedule has_more=" + hasMore +
            "; Winamax rows=" + odds.items.length +
            "; valid decimal quotes=" + Number(odds.diagnostics.validDecimalOdds) +
            "; fresh quotes=" + freshQuotes +
            "; newest scraped=" + (odds.diagnostics.newestScrapedAt || "unknown") + ".");
          NODE
