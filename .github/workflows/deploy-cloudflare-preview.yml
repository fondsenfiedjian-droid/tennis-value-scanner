name: Deploy Cloudflare Worker Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/integration/tvs2-pro-api'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PRO integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/tvs2-pro-api
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy isolated Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_TENNIS_API_KEY_PREVIEW: ${{ secrets.LIVE_TENNIS_API_KEY_PREVIEW }}
          TVS_RESEARCH_ACCESS_TOKEN_PREVIEW: ${{ secrets.TVS_RESEARCH_ACCESS_TOKEN_PREVIEW }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_PREVIEW_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$LIVE_TENNIS_API_KEY_PREVIEW" ]; then
            echo "::error::Missing repository secret LIVE_TENNIS_API_KEY_PREVIEW; refusing to deploy an unusable Preview Worker"
            exit 1
          fi
          npx --yes wrangler@4.165.0 deploy --config wrangler.preview.toml
          printf '%s' "$LIVE_TENNIS_API_KEY_PREVIEW" | npx --yes wrangler@4.165.0 secret put LIVE_TENNIS_API_KEY --config wrangler.preview.toml
          if [ -n "$TVS_RESEARCH_ACCESS_TOKEN_PREVIEW" ]; then
            printf '%s' "$TVS_RESEARCH_ACCESS_TOKEN_PREVIEW" | npx --yes wrangler@4.165.0 secret put TVS_RESEARCH_ACCESS_TOKEN --config wrangler.preview.toml
          fi
