name: Deploy Cloudflare Worker Preview

on:
  workflow_dispatch:
  push:
    branches:
      - ui/tennis-value-scanner-2

permissions:
  contents: read

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/ui/tennis-value-scanner-2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: ui/tennis-value-scanner-2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy isolated Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_PREVIEW_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          npx --yes wrangler@4.165.0 deploy --config wrangler.preview.toml

      - name: Smoke-check isolated Preview Worker and Live Tennis configuration
        env:
          PREVIEW_WORKER_URL: https://tennis-value-api-preview.fonds-enfiedjian.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.PREVIEW_WORKER_URL + "/health";
          const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
          if (!response.ok) throw new Error("Preview Worker health returned HTTP " + response.status);
          const health = await response.json();
          if (health.status !== "ok") throw new Error("Preview Worker health is not ok");
          if (health.liveTennisApiConfigured !== true) {
            throw new Error("Preview Worker is missing LIVE_TENNIS_API_KEY; player search and Elo comparison cannot work");
          }
          const endpoints = Array.isArray(health.endpoints) ? health.endpoints : [];
          if (!endpoints.some(endpoint => endpoint.startsWith("/players/search"))) {
            throw new Error("Preview Worker does not advertise /players/search");
          }
          if (!endpoints.includes("/predict")) throw new Error("Preview Worker does not advertise /predict");
          console.log("Preview Worker health OK; Live Tennis API configured; player search and Elo comparison routes advertised.");
          NODE
