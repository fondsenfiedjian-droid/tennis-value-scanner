name: Deploy Cloudflare Worker Preview

on:
  workflow_dispatch:
  push:
    branches:
      - ui/tennis-value-scanner-2
      - integration/live-tennis-pro-markets

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-worker
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/ui/tennis-value-scanner-2' || github.ref == 'refs/heads/integration/live-tennis-pro-markets'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy isolated Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_PREVIEW_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          npx --yes wrangler@4.165.0 deploy --config wrangler.preview.toml

      - name: Rotate ephemeral Preview history download token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare Preview credentials are required to rotate the temporary research token"
            exit 1
          fi
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$token"
          printf '%s' "$token" | npx --yes wrangler@4.165.0 secret put TVS_RESEARCH_ACCESS_TOKEN --config wrangler.preview.toml
          echo "TVS_RESEARCH_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Smoke-check isolated Preview Worker and Live Tennis configuration
        env:
          PREVIEW_WORKER_URL: https://tennis-value-api-preview.fonds-enfiedjian.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.PREVIEW_WORKER_URL + "/health";
          const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
          if (!response.ok) throw new Error("Preview Worker health returned HTTP " + response.status);
          const health = await response.json();
          if (health.status !== "ok") throw new Error("Preview Worker health is not ok");
          if (health.liveTennisApiConfigured !== true) {
            throw new Error("Preview Worker is missing LIVE_TENNIS_API_KEY; player search and Elo comparison cannot work");
          }
          if (health.researchAccessConfigured !== true) {
            throw new Error("Preview Worker research download token is not configured after secret rotation");
          }
          const endpoints = Array.isArray(health.endpoints) ? health.endpoints : [];
          if (!endpoints.some(endpoint => endpoint.startsWith("/players/search"))) {
            throw new Error("Preview Worker does not advertise /players/search");
          }
          if (!endpoints.includes("/predict")) throw new Error("Preview Worker does not advertise /predict");
          if (!endpoints.includes("/markets?match_id=123") ||
              !endpoints.includes("/markets/123/prices") ||
              !endpoints.includes("/matches/123/prices")) {
            throw new Error("Preview Worker does not advertise Live Tennis PRO market routes; buildId=" + health.buildId + "; endpoints=" + JSON.stringify(endpoints));
          }
          console.log("Preview Worker health OK; Live Tennis API configured; player search, Elo and PRO market routes advertised.");
          NODE

      - name: End-to-end player comparison smoke test (uses cached API reads)
        env:
          PREVIEW_WORKER_URL: https://tennis-value-api-preview.fonds-enfiedjian.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.PREVIEW_WORKER_URL;
          async function read(path, options) {
            const response = await fetch(base + path, { ...options, signal: AbortSignal.timeout(15000) });
            let payload = {};
            try { payload = await response.json(); } catch {}
            if (!response.ok) throw new Error("Preview comparison endpoint failed with HTTP " + response.status);
            return payload;
          }
          const [searchA, searchB] = await Promise.all([
            read("/players/search?search=Novak&limit=8"),
            read("/players/search?search=Carlos%20Alcaraz&limit=8")
          ]);
          const playerA = searchA.players?.find(player => player.name === "Novak Djokovic");
          const playerB = searchB.players?.find(player => player.name === "Carlos Alcaraz");
          if (!playerA || !playerB) throw new Error("Preview player search did not resolve both smoke-test players");
          const comparison = await read("/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              playerIdA: playerA.id, playerIdB: playerB.id,
              playerA: playerA.name, playerB: playerB.name, surface: "hard"
            })
          });
          const probabilityA = Number(comparison.probabilityA);
          const probabilityB = Number(comparison.probabilityB);
          if (!Number.isFinite(comparison.ratingA) || !Number.isFinite(comparison.ratingB) ||
              !Number.isFinite(probabilityA) || !Number.isFinite(probabilityB) ||
              Math.abs(probabilityA + probabilityB - 100) > 0.05) {
            throw new Error("Preview Elo comparison returned invalid ratings or probabilities");
          }
          const usage = await read("/usage");
          const tier = String(usage.tier || usage.base_tier || "unknown").toLowerCase();
          const productionUsageResponse = await fetch("https://tennis-value-api.fonds-enfiedjian.workers.dev/usage", {
            signal: AbortSignal.timeout(15000)
          });
          const productionUsage = await productionUsageResponse.json();
          if (!productionUsageResponse.ok) throw new Error("Production read-only usage diagnostic failed with HTTP " + productionUsageResponse.status);
          const productionTier = String(productionUsage.tier || productionUsage.base_tier || "unknown").toLowerCase();
          console.log("Live Tennis key tiers: Preview=" + tier + "; Production=" + productionTier + ".");
          if (["pro", "ultra"].includes(tier)) {
            const marketSchedule = await read("/matches?status=upcoming&limit=200");
            const marketMatch = (Array.isArray(marketSchedule.data) ? marketSchedule.data : [])
              .find(match => match?.has_market === true && Number.isSafeInteger(Number(match.id)) && Number(match.id) > 0);
            if (marketMatch) {
              const marketResponse = await fetch(base + "/markets?match_id=" + encodeURIComponent(marketMatch.id), { signal: AbortSignal.timeout(15000) });
              if (marketResponse.status === 403) throw new Error("Live Tennis PRO markets returned HTTP 403 despite PRO tier");
              if (![200, 404].includes(marketResponse.status)) throw new Error("Live Tennis market smoke test returned HTTP " + marketResponse.status);
              if (marketResponse.ok) {
                const pricesResponse = await fetch(base + "/markets/" + encodeURIComponent(marketMatch.id) + "/prices?limit=5", { signal: AbortSignal.timeout(15000) });
                if (pricesResponse.status === 403) throw new Error("Live Tennis PRO price history returned HTTP 403 despite PRO tier");
                if (![200, 404].includes(pricesResponse.status)) throw new Error("Live Tennis price-history smoke test returned HTTP " + pricesResponse.status);
              }
            } else {
              console.log("Live Tennis PRO tier verified; no upcoming match currently advertises has_market=true, so price smoke test was skipped.");
            }
          } else {
            console.log("Live Tennis market smoke test skipped: Preview tier=" + tier + "; Production tier=" + productionTier + ". Upgrade the same API key or update both Worker secrets after the provider confirms PRO.");
          }
          const [historyAResponse, historyBResponse, h2hResponse] = await Promise.all([
            fetch(base + "/player-history?id=" + encodeURIComponent(playerA.id) + "&limit=20"),
            fetch(base + "/player-history?id=" + encodeURIComponent(playerB.id) + "&limit=20"),
            fetch(base + "/player-h2h?p1=" + encodeURIComponent(playerA.name) + "&p2=" + encodeURIComponent(playerB.name))
          ]);
          const [historyA, historyB, h2h] = await Promise.all([
            historyAResponse.json(), historyBResponse.json(), h2hResponse.json()
          ]);
          const historyAllowed = ["basic", "pro", "ultra"].includes(tier);
          const historyOK = historyAResponse.ok && historyBResponse.ok &&
            Array.isArray(historyA.data) && Array.isArray(historyB.data);
          const h2hOK = h2hResponse.ok && h2h.totals && Array.isArray(h2h.meetings) &&
            h2h.players?.p1?.name === playerA.name && h2h.players?.p2?.name === playerB.name;
          if (historyAllowed && (!historyOK || !h2hOK)) {
            throw new Error("API tier reports " + tier + " but Basic history/H2H failed: history HTTP " +
              historyAResponse.status + "/" + historyBResponse.status + ", H2H HTTP " + h2hResponse.status +
              "; accessStatus=" + (historyA.accessStatus || historyB.accessStatus || h2h.accessStatus || "unknown"));
          }
          console.log("Comparison core OK: search and Elo; Preview API tier=" + tier +
            "; Production API tier=" + productionTier +
            "; history=" + (historyOK ? "available" : "HTTP " + historyAResponse.status + "/" + historyBResponse.status) +
            "; H2H=" + (h2hOK ? "available" : "HTTP " + h2hResponse.status) + ".");
          NODE

      - name: Verify Live Tennis PRO historical bulk packages
        env:
          PREVIEW_WORKER_URL: https://tennis-value-api-preview.fonds-enfiedjian.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.PREVIEW_WORKER_URL;
          async function read(path) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(20000) });
            let payload = {};
            try { payload = await response.json(); } catch {}
            if (!response.ok) {
              throw new Error("History package request " + path + " returned HTTP " + response.status +
                "; accessStatus=" + (payload.accessStatus || payload.error || "unknown"));
            }
            return payload;
          }
          const [tape, archive] = await Promise.all([
            read("/history/packages?kind=tape"),
            read("/history/packages?kind=archive")
          ]);
          const coverage = await read("/history/coverage");
          if (!coverage.buckets || !coverage.totals) {
            throw new Error("History coverage endpoint returned no measured tour/draw buckets");
          }
          if (!Array.isArray(tape.data) || !Array.isArray(archive.data) ||
              tape.data.length === 0 || archive.data.length === 0) {
            throw new Error("PRO package inventory is empty or malformed: tape=" +
              (tape.data?.length ?? "missing") + "; archive=" + (archive.data?.length ?? "missing"));
          }
          const latestTape = tape.data[0];
          const latestArchive = archive.data[0];
          if (!latestTape.period || !latestArchive.period) {
            throw new Error("History package inventory has no period identifiers");
          }
          const [tapeManifest, archiveManifest] = await Promise.all([
            read("/history/packages/" + encodeURIComponent(latestTape.period) + "?kind=tape"),
            read("/history/packages/" + encodeURIComponent(latestArchive.period) + "?kind=archive")
          ]);
          for (const [label, manifest] of [["tape", tapeManifest], ["archive", archiveManifest]]) {
            if (!Array.isArray(manifest.files) || manifest.files.length === 0) {
              throw new Error(label + " package manifest has no downloadable files");
            }
          }
          const archiveCsv = archiveManifest.files.find(file => file.format === "csv");
          if (!archiveCsv) throw new Error("Latest archive package has no CSV download");
          const downloadResponse = await fetch(base + "/history/packages/" +
            encodeURIComponent(latestArchive.period) + "?kind=archive&format=csv", {
              headers: { "X-Research-Access": process.env.TVS_RESEARCH_ACCESS_TOKEN || "" },
              signal: AbortSignal.timeout(30000)
            });
          if (!downloadResponse.ok) {
            const errorBody = await downloadResponse.text();
            throw new Error("Protected archive package download returned HTTP " + downloadResponse.status +
              "; response=" + errorBody.slice(0, 300));
          }
          const { gunzipSync } = await import("node:zlib");
          const { parseCsv } = await import("./scripts/backtest.mjs");
          const archiveBytes = Buffer.from(await downloadResponse.arrayBuffer());
          if (archiveCsv.compression === "gzip" &&
              !(archiveBytes[0] === 0x1f && archiveBytes[1] === 0x8b)) {
            throw new Error("Archive package compression does not match its manifest");
          }
          const archiveText = archiveCsv.compression === "gzip"
            ? gunzipSync(archiveBytes).toString("utf8") : archiveBytes.toString("utf8");
          const archiveRows = parseCsv(archiveText);
          if (archiveRows.length !== Number(latestArchive.match_count)) {
            throw new Error("2022 archive CSV rows (" + archiveRows.length +
              ") do not match manifest count (" + latestArchive.match_count + ")");
          }
          const fieldCoverage = field => archiveRows.filter(row =>
            row[field] !== undefined && row[field] !== null && row[field] !== "").length;
          const completedRows = archiveRows.filter(row => row.outcome === "completed");
          console.log("Archive CSV parsed: " + archiveCsv.filename + "; rows=" + archiveRows.length +
            "; completed=" + completedRows.length +
            "; columns=" + Object.keys(archiveRows[0] || {}).join(",") +
            "; firstRow=" + JSON.stringify(archiveRows[0] || {}) +
            "; surface known=" + fieldCoverage("surface") + ".");
          console.log("History coverage snapshot: as_of=" + (coverage.as_of || "unknown") +
            "; ATP singles=" + (coverage.buckets.atp_singles?.completed ?? "unknown") +
            "; WTA singles=" + (coverage.buckets.wta_singles?.completed ?? "unknown") +
            "; Challenger singles=" + (coverage.buckets.challenger_singles?.completed ?? "unknown") +
            "; ITF singles=" + (coverage.buckets.itf_singles?.completed ?? "unknown") + ".");
          console.log("Live Tennis PRO bulk history verified: monthly tape packages=" + tape.data.length +
            "; newest tape=" + latestTape.period + "; matches=" + (latestTape.match_count ?? "unknown") +
            "; archive years=" + archive.data.length + "; newest archive year=" + latestArchive.period +
            "; archive results=" + (latestArchive.match_count ?? "unknown") +
            "; tape schema=" + (tapeManifest.schema_version ?? "unversioned") + ".");
          NODE

      - name: Scanner schedule and Winamax feed smoke test
        env:
          PREVIEW_WORKER_URL: https://tennis-value-api-preview.fonds-enfiedjian.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.PREVIEW_WORKER_URL;
          async function read(path) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(15000) });
            if (!response.ok) throw new Error("Scanner source failed with HTTP " + response.status);
            return response.json();
          }
          const from = new Date();
          from.setHours(0, 0, 0, 0);
          const to = new Date(from);
          to.setDate(to.getDate() + 7);
          to.setMilliseconds(-1);
          const params = new URLSearchParams({
            status: "upcoming", draw: "singles", limit: "200",
            from: from.toISOString(), to: to.toISOString()
          });
          const scheduleRows = [];
          let offset = 0, pages = 0, total = null, hasMore = false;
          let odds;
          while (pages < 4) {
            params.set("offset", String(offset));
            const schedule = await read("/matches?" + params.toString());
            const pageRows = Array.isArray(schedule.data) ? schedule.data :
              Array.isArray(schedule.matches) ? schedule.matches : null;
            if (!pageRows) throw new Error("Schedule response has no recognized match array");
            scheduleRows.push(...pageRows);
            const meta = schedule.meta || {};
            if (meta.total !== null && meta.total !== undefined && Number.isFinite(Number(meta.total))) total = Number(meta.total);
            hasMore = meta.has_more === true;
            pages++;
            if (!hasMore) break;
            const count = Number(meta.count);
            if (!Number.isInteger(count) || count <= 0 || pageRows.length === 0) {
              throw new Error("Schedule pagination metadata is invalid");
            }
            offset = (Number.isInteger(Number(meta.offset)) ? Number(meta.offset) : offset) + count;
          }
          if (hasMore || (total !== null && scheduleRows.length < total)) {
            throw new Error("Schedule pagination did not retrieve the complete seven-day singles window");
          }
          odds = await read("/odds");
          if (!Array.isArray(odds.items)) throw new Error("Winamax odds response has no items array");
          if (!odds.diagnostics || !Number.isFinite(Number(odds.diagnostics.validDecimalOdds))) {
            throw new Error("Winamax odds diagnostics are missing or malformed");
          }
          const freshQuotes = odds.diagnostics.freshScrapedAt !== null &&
            odds.diagnostics.freshScrapedAt !== undefined &&
            Number.isFinite(Number(odds.diagnostics.freshScrapedAt))
            ? Number(odds.diagnostics.freshScrapedAt) : "unknown";
          const totalLabel = total === null ? "unknown" : total;
          console.log("Scanner sources OK: schedule pages=" + pages +
            "; schedule rows=" + scheduleRows.length + "; schedule total=" + totalLabel +
            "; Winamax rows=" + odds.items.length +
            "; valid decimal quotes=" + Number(odds.diagnostics.validDecimalOdds) +
            "; fresh quotes=" + freshQuotes +
            "; newest scraped=" + (odds.diagnostics.newestScrapedAt || "unknown") + ".");
          NODE
