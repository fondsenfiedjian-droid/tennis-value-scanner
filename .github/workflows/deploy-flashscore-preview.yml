name: Deploy Flashscore Winamax isolated Preview Worker

on:
  push:
    branches:
      - feature/flashscore-winamax-integration-preview
    paths:
      - "worker.js"
      - "wrangler.preview.toml"
      - ".github/workflows/deploy-flashscore-preview.yml"

permissions:
  contents: read

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/feature/flashscore-winamax-integration-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Flashscore Preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/flashscore-winamax-integration-preview
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy isolated Cloudflare Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_TENNIS_API_KEY_PREVIEW: ${{ secrets.LIVE_TENNIS_API_KEY_PREVIEW }}
          TVS_RESEARCH_ACCESS_TOKEN_PREVIEW: ${{ secrets.TVS_RESEARCH_ACCESS_TOKEN_PREVIEW }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare Preview credentials are required"
            exit 1
          fi
          if [ -z "$LIVE_TENNIS_API_KEY_PREVIEW" ]; then
            echo "::error::LIVE_TENNIS_API_KEY_PREVIEW is required"
            exit 1
          fi
          npx --yes wrangler@4.165.0 deploy --config wrangler.preview.toml
          printf '%s' "$LIVE_TENNIS_API_KEY_PREVIEW" | npx --yes wrangler@4.165.0 secret put LIVE_TENNIS_API_KEY --config wrangler.preview.toml
          if [ -n "$TVS_RESEARCH_ACCESS_TOKEN_PREVIEW" ]; then
            printf '%s' "$TVS_RESEARCH_ACCESS_TOKEN_PREVIEW" | npx --yes wrangler@4.165.0 secret put TVS_RESEARCH_ACCESS_TOKEN --config wrangler.preview.toml
          fi
      - name: Verify Preview comparison, schedule and Flashscore feed
        run: |
          node scripts/preview-runtime-smoke.mjs
          node --input-type=module <<'NODE'
          const base = "https://tennis-value-api-preview.fonds-enfiedjian.workers.dev";
          const response = await fetch(base + "/odds?previewProbe=" + Date.now(), { signal: AbortSignal.timeout(25000) });
          const payload = await response.json();
          if (!response.ok) throw new Error("/odds returned HTTP " + response.status);
          if (payload.flashscore?.actor !== "incognito_mode~flashscore-odds-scraper") {
            throw new Error("Flashscore actor diagnostics are missing from the Preview feed");
          }
          if (!Number.isFinite(Number(payload.sourceCounts?.flashscore)) ||
              !Number.isFinite(Number(payload.sourceCounts?.vavilov))) {
            throw new Error("Winamax source counts are missing from the Preview feed");
          }
          console.log(JSON.stringify({
            flashscoreDiagnostic: payload.flashscore.diagnostic,
            flashscoreDiagnostics: payload.flashscore.diagnostics,
            flashscoreNormalizedQuotes: payload.sourceCounts.flashscore,
            vavilovRows: payload.sourceCounts.vavilov,
            combinedRows: payload.count,
            retrievedAt: payload.retrievedAt
          }, null, 2));
          NODE
