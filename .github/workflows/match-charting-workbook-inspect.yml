name: Match Charting workbook dictionary inspection

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/match-charting-workbook-inspect.py"
      - ".github/workflows/match-charting-workbook-inspect.yml"
      - "docs/PFE_FEATURE_MAP.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Download pinned source workbook
        env:
          SOURCE_COMMIT: 1813a1309b7ed7ebf1c7e884b32bf675d00e4edf
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/JeffSackmann/tennis_MatchChartingProject/$SOURCE_COMMIT/MatchChart%200.3.2.xlsm" \
            --output /tmp/MatchChart.xlsm
          test -s /tmp/MatchChart.xlsm
      - name: Extract instruction text only
        run: |
          python scripts/match-charting-workbook-inspect.py /tmp/MatchChart.xlsm --out matchchart-instructions.txt
      - name: Upload short-lived instruction extraction
        uses: actions/upload-artifact@v4
        with:
          name: match-charting-instructions
          path: matchchart-instructions.txt
          if-no-files-found: error
          retention-days: 7
