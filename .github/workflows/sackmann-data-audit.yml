name: Sackmann historical data coverage and import audit

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/sackmann-data-audit.mjs"
      - "scripts/sackmann-import.mjs"
      - "tests/sackmann-data-audit.test.mjs"
      - "tests/sackmann-import.test.mjs"
      - ".github/workflows/sackmann-data-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download ATP and WTA main-tour match CSVs (1968–2026)
        run: |
          set -euo pipefail
          mkdir -p research-data
          for tour in atp wta; do
            for year in $(seq 1968 2026); do
              url="https://raw.githubusercontent.com/Aneeshers/tennis-sackmann-archive/main/${tour}/${tour}_matches_${year}.csv"
              curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$url" \
                --output "research-data/${tour}_matches_${year}.csv"
              test -s "research-data/${tour}_matches_${year}.csv"
            done
          done
      - name: Run the actual ATP and WTA normalizers
        run: |
          set -euo pipefail
          node scripts/sackmann-import.mjs --tour atp --input-dir research-data --output "$RUNNER_TEMP/atp-normalized.csv"
          node scripts/sackmann-import.mjs --tour wta --input-dir research-data --output "$RUNNER_TEMP/wta-normalized.csv"
      - name: Validate normalized outputs and classify source-key collisions
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { parseCsv } from "./scripts/backtest.mjs";

          const reports = [];
          for (const tour of ["atp", "wta"]) {
            const rows = parseCsv(await readFile(`${process.env.RUNNER_TEMP}/${tour}-normalized.csv`, "utf8"));
            if (!rows.length) throw new Error(`${tour.toUpperCase()} importer produced no completed matches`);
            const dates = rows.map(row => row.tourney_date).filter(Boolean).sort();
            const sourceGroups = new Map();
            const naturalGroups = new Map();
            for (const row of rows) {
              const pair = [row.winner_id,row.loser_id].sort((a,b)=>Number(a)-Number(b)).join(":");
              const sourceKey = row.tourney_id && row.match_num
                ? `${row.tourney_id}:${row.match_num}`
                : `${row.tourney_date}:${pair}`;
              const naturalKey = row.tourney_id && row.match_num
                ? [row.tourney_id,row.tourney_date,row.match_num,pair,row.round].join(":")
                : [row.tourney_date,pair,row.surface].join(":");
              if (!sourceGroups.has(sourceKey)) sourceGroups.set(sourceKey, []);
              sourceGroups.get(sourceKey).push(row);
              if (!naturalGroups.has(naturalKey)) naturalGroups.set(naturalKey, []);
              naturalGroups.get(naturalKey).push(row);
            }
            const collisions = [...sourceGroups.values()].filter(group => group.length > 1);
            const naturalDuplicates = [...naturalGroups.values()].filter(group => group.length > 1);
            const dateVaries = collisions.filter(group => new Set(group.map(row=>row.tourney_date)).size > 1).length;
            const pairVaries = collisions.filter(group => new Set(group.map(row=>[row.winner_id,row.loser_id].sort((a,b)=>Number(a)-Number(b)).join(":"))).size > 1).length;
            const collisionYears = {};
            for (const group of collisions) {
              const year = group[0].tourney_date.slice(0,4) || "unknown";
              collisionYears[year] = (collisionYears[year] ?? 0) + 1;
            }
            const summary = {
              tour: tour.toUpperCase(),
              importedMatches: rows.length,
              firstDate: dates[0] ?? null,
              lastDate: dates.at(-1) ?? null,
              rankBothPct: Number((100 * rows.filter(r => r.winner_rank && r.loser_rank).length / rows.length).toFixed(2)),
              ageBothPct: Number((100 * rows.filter(r => r.winner_age && r.loser_age).length / rows.length).toFixed(2)),
              knownSurfacePct: Number((100 * rows.filter(r => r.surface).length / rows.length).toFixed(2)),
              sourceKeyCollisionGroups: collisions.length,
              collisionsAcrossDates: dateVaries,
              collisionsAcrossPlayerPairs: pairVaries,
              naturalDuplicateGroups: naturalDuplicates.length,
              collisionYears
            };
            reports.push(summary);
            console.log(JSON.stringify(summary));
          }
          const fs = await import("node:fs/promises");
          const lines = [
            "| Tour | Imported matches | First date | Last date | Both ranks | Both ages | Known surface | Source-key collisions | Natural duplicate groups |",
            "|---|---:|---|---|---:|---:|---:|---:|---:|",
            ...reports.map(r => `| ${r.tour} | ${r.importedMatches} | ${r.firstDate} | ${r.lastDate} | ${r.rankBothPct}% | ${r.ageBothPct}% | ${r.knownSurfacePct}% | ${r.sourceKeyCollisionGroups} (dates ${r.collisionsAcrossDates}, pairs ${r.collisionsAcrossPlayerPairs}) | ${r.naturalDuplicateGroups} |`)
          ];
          await fs.appendFile(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          NODE
      - name: Audit source field coverage and missingness
        run: node scripts/sackmann-data-audit.mjs --out "$RUNNER_TEMP/sackmann-data-audit.json" research-data/*_matches_*.csv
      - name: Upload aggregate-only audit report
        uses: actions/upload-artifact@v4
        with:
          name: sackmann-data-coverage-audit
          path: ${{ runner.temp }}/sackmann-data-audit.json
          if-no-files-found: error
          retention-days: 30
