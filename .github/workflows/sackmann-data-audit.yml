name: Sackmann historical data coverage audit

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/sackmann-data-audit.mjs"
      - "tests/sackmann-data-audit.test.mjs"
      - ".github/workflows/sackmann-data-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download ATP and WTA match CSVs (1991–2026)
        run: |
          mkdir -p research-data
          for tour in atp wta; do
            for year in $(seq 1991 2026); do
              url="https://raw.githubusercontent.com/Aneeshers/tennis-sackmann-archive/main/${tour}/${tour}_matches_${year}.csv"
              curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$url" \
                --output "research-data/${tour}_matches_${year}.csv"
              test -s "research-data/${tour}_matches_${year}.csv"
            done
          done
      - name: Audit field coverage and missingness
        run: |
          node scripts/sackmann-data-audit.mjs --out sackmann-data-audit.json research-data/*_matches_*.csv
      - name: Upload aggregate audit report
        uses: actions/upload-artifact@v4
        with:
          name: sackmann-data-coverage-audit
          path: sackmann-data-audit.json
          if-no-files-found: error
          retention-days: 30
