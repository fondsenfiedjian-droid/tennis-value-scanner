name: One-time Direct Winamax Diagnostic

on:
  push:
    branches:
      - diagnostic/winamax-direct-once-20261125

permissions:
  contents: read

concurrency:
  group: winamax-direct-diagnostic-once
  cancel-in-progress: false

jobs:
  run-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out isolated diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diagnostic/winamax-direct-once-20261125

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy isolated Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.165.0 deploy --config wrangler.preview.toml

      - name: Install temporary one-time trigger credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "DIAGNOSTIC_TOKEN=$token" >> "$GITHUB_ENV"
          printf '%s' "$token" | npx --yes wrangler@4.165.0 secret put DIAGNOSTIC_TRIGGER_TOKEN --config wrangler.preview.toml
          sleep 10

      - name: Start one capped Winamax actor run
        id: start
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $DIAGNOSTIC_TOKEN" \
            "https://tennis-value-api-preview.fonds-enfiedjian.workers.dev/__diagnostic/winamax-direct/start")"
          echo "$response" | jq .
          run_id="$(echo "$response" | jq -r '.runId // empty')"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "$run_id" > winamax-direct-run-id.txt

      - name: Wait for run and retrieve dataset
        env:
          RUN_ID: ${{ steps.start.outputs.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $DIAGNOSTIC_TOKEN" \
              "https://tennis-value-api-preview.fonds-enfiedjian.workers.dev/__diagnostic/winamax-direct/status?runId=$RUN_ID")"
            status="$(echo "$response" | jq -r '.status // "UNKNOWN"')"
            echo "Apify run status: $status (poll $attempt/90)"
            if [ "$status" = "SUCCEEDED" ]; then
              printf '%s\n' "$response" > winamax-direct-diagnostic.json
              echo "$response" | jq '{status,runId,itemCount,usageTotalUsd,stats,sample:(.items[:12])}'
              exit 0
            fi
            case "$status" in
              FAILED|ABORTED|TIMED-OUT) echo "$response" | jq .; printf '%s\n' "$response" > winamax-direct-diagnostic.json; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out while waiting for Apify run $RUN_ID"
          exit 1

      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winamax-direct-diagnostic
          path: |
            winamax-direct-diagnostic.json
            winamax-direct-run-id.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Remove temporary trigger credential
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${DIAGNOSTIC_TOKEN:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            yes | npx --yes wrangler@4.165.0 secret delete DIAGNOSTIC_TRIGGER_TOKEN --config wrangler.preview.toml || true
          fi
