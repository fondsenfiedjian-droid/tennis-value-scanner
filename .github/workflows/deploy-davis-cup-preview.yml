name: Deploy Davis Cup Preview Worker

on:
  push:
    branches:
      - feature/davis-cup-odds-preview

permissions:
  contents: read

concurrency:
  group: davis-cup-preview-deploy
  cancel-in-progress: false

jobs:
  deploy-davis-cup-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Davis Cup preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/davis-cup-odds-preview

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy isolated Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_PREVIEW_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          npx --yes wrangler@4.165.0 deploy --config wrangler.preview.toml

      - name: Smoke-check Davis Cup endpoint
        env:
          PREVIEW_WORKER_URL: https://tennis-value-api-preview.fonds-enfiedjian.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.PREVIEW_WORKER_URL;
          async function read(path) {
            const res = await fetch(base + path, { signal: AbortSignal.timeout(20000) });
            let data = {};
            try { data = await res.json(); } catch {}
            if (!res.ok) throw new Error(path + " returned HTTP " + res.status + ": " + (data.error || "no details"));
            return data;
          }
          const health = await read("/health");
          if (health.status !== "ok" || !health.endpoints?.includes("/davis-cup")) {
            throw new Error("Preview Worker does not advertise the /davis-cup endpoint");
          }
          const feed = await read("/davis-cup");
          if (!Array.isArray(feed.items) || !Number.isFinite(Number(feed.count)) || Number(feed.count) !== feed.items.length) {
            throw new Error("/davis-cup returned an invalid feed shape");
          }
          for (const item of feed.items) {
            if (!item.homeTeam || !item.awayTeam || item.bookmaker !== "Winamax" ||
                item.bookmakerCountry !== "FR" || !(Number(item.homeOdds) > 1) || !(Number(item.awayOdds) > 1)) {
              throw new Error("/davis-cup returned an invalid or non-French-Winamax team quote");
            }
          }
          console.log("Davis Cup Preview OK: " + feed.count + " Winamax FR team quotes; retrievedAt=" + feed.retrievedAt);
          NODE

  restore-shared-preview:
    if: always()
    needs: deploy-davis-cup-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR 180 preview branch
        uses: actions/checkout@v4
        with:
          ref: test/matches-and-comparison

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore the shared PR 180 Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing Cloudflare preview credentials"
            exit 1
          fi
          npx --yes wrangler@4.165.0 deploy --config wrangler.preview.toml
