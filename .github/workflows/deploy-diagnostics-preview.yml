name: Deploy Diagnostics Worker Preview

on:
  push:
    branches:
      - feature/production-data-diagnostics

permissions:
  contents: read

concurrency:
  group: diagnostics-worker-preview
  cancel-in-progress: true

jobs:
  deploy-diagnostics-preview:
    if: github.ref == 'refs/heads/feature/production-data-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out diagnostics branch
        uses: actions/checkout@v4
        with:
          ref: feature/production-data-diagnostics

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy isolated diagnostics Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_PREVIEW_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          npx --yes wrangler@4.165.0 deploy --config wrangler.diagnostics-preview.toml

      - name: Configure Live Tennis API key
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY_PREVIEW }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$LIVE_TENNIS_API_KEY" ]; then
            echo "::error::Missing repository secret LIVE_TENNIS_API_KEY_PREVIEW"
            exit 1
          fi
          printf '%s' "$LIVE_TENNIS_API_KEY" | npx --yes wrangler@4.165.0 secret put LIVE_TENNIS_API_KEY --config wrangler.diagnostics-preview.toml

      - name: Verify diagnostics Worker and Live Tennis API authentication
        run: |
          export DIAGNOSTICS_BASE="https://tennis-value-api-diagnostics-preview.fonds-enfiedjian.workers.dev"
          base="$DIAGNOSTICS_BASE"
          curl --fail --silent --show-error "$base/health" -o /tmp/diagnostics-health.json
          node -e 'const d=require("/tmp/diagnostics-health.json"); if(d.status!=="ok" || d.liveTennisApiConfigured!==true) { console.error("Diagnostics Worker health check failed"); process.exit(1); } console.log("Diagnostics Worker health: OK; Live Tennis API secret: configured");'
          curl --fail --silent --show-error "$base/usage" -o /dev/null
          echo "Live Tennis API authentication: HTTP 200"

          curl --fail --silent --show-error "$base/history/coverage" -o /tmp/history-coverage.json
          node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/history-coverage.json","utf8")); for(const k of ["as_of","built_at","method","totals","buckets","inventory","ledger_max_computed_at"]) if(d[k]!==undefined) console.log("Coverage "+k+":",JSON.stringify(d[k]).slice(0,3500));'

          curl --fail --silent --show-error "$base/players/search?search=Novak%20Djokovic" -o /tmp/player-search.json
          node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/player-search.json","utf8")); if(!Array.isArray(d.players)||!d.players.length||!d.players[0].id) throw new Error("Player search returned no usable player ID"); require("fs").writeFileSync("/tmp/player-id",String(d.players[0].id)); console.log("Player search: ",d.count,"players; first result has a valid ID");'

          player_id="$(cat /tmp/player-id)"
          export PLAYER_ID="$player_id"
          curl --fail --silent --show-error "$base/player-history?id=$player_id&limit=50&tour=atp" -o /tmp/player-history.json
          node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/player-history.json","utf8")); if(!Array.isArray(d.data)) throw new Error("Player history data is not an array"); console.log("Player history access:",d.accessStatus,"; page count:",d.count,"; pagination:",JSON.stringify(d.meta||{})); const dates=d.data.map(x=>x.scheduled_time||x.created_at).filter(Boolean).sort(); if(dates.length) console.log("Returned match date range:",dates[0],"to",dates[dates.length-1]); const surfaces={}; for(const m of d.data) surfaces[m.surface||"unknown"]=(surfaces[m.surface||"unknown"]||0)+1; console.log("Surface distribution:",JSON.stringify(surfaces)); if(d.data.length){console.log("History record fields:",Object.keys(d.data[0]).join(", "));}'

          node -e ' (async()=>{ const base=process.env.DIAGNOSTICS_BASE; const id=process.env.PLAYER_ID; const seen=new Map(); let offset=0,hasMore=true,pages=0; const surfaces={}; const dates=[]; while(hasMore && pages<100){ const r=await fetch(base+"/player-history?id="+id+"&limit=50&offset="+offset+"&tour=atp"); if(!r.ok) throw new Error("History page "+offset+" HTTP "+r.status); const d=await r.json(); if(!Array.isArray(d.data)) throw new Error("Invalid history page at offset "+offset); pages++; for(const m of d.data){ if(m.id!=null) seen.set(String(m.id),m); const surface=m.surface||"unknown"; surfaces[surface]=(surfaces[surface]||0)+1; const date=m.scheduled_time||m.created_at; if(date) dates.push(date); } hasMore=Boolean(d.meta?.has_more); if(!d.data.length && hasMore) throw new Error("Empty page while has_more=true"); offset+=50; } dates.sort(); console.log("Full player history pagination: pages",pages,"; unique matches",seen.size,"; stopped at offset",offset,"; has_more after cap:",hasMore); if(dates.length) console.log("Full history date range:",dates[0],"to",dates[dates.length-1]); console.log("Full history surfaces:",JSON.stringify(surfaces)); })().catch(e=>{console.error(e);process.exit(1)})'
          
# Keep the isolated diagnostics deployment and secret setup in sync.
