name: Aggregator 1 full dataset audit

on:
  push:
    branches:
      - research/aggregator1-linkage-audit
    paths:
      - '.github/workflows/aggregator1-full-audit.yml'
      - 'scripts/aggregator1-linkage-audit.mjs'
      - 'scripts/aggregator1-player-id-audit.mjs'
      - 'scripts/aggregator1-duplicate-audit.mjs'
  workflow_dispatch:
    inputs:
      date_window:
        description: "Maximum date difference in days"
        required: true
        default: "14"
        type: string

permissions:
  contents: read

concurrency:
  group: aggregator1-full-dataset-audit
  cancel-in-progress: false

jobs:
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/aggregator1-linkage-audit

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Valuebetennis and Sackmann datasets
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/aggregator1"
          mkdir -p "$ROOT/valuebetennis" "$ROOT/sackmann" audit-output
          for year in 2021 2022 2023 2024 2025 2026; do
            file="valuebetennis-matchs-${year}.csv"
            curl --fail --location --retry 2 --user-agent "TennisValueScanner-Aggregator1-Research/1.0" \
              "https://www.valuebetennis.com/datasets/${file}" \
              --output "$ROOT/valuebetennis/$file"
            test -s "$ROOT/valuebetennis/$file"
          done
          for tour in atp wta; do
            for year in 2021 2022 2023 2024 2025 2026; do
              files=("${tour}_matches_${year}.csv")
              if [[ "$tour" == "atp" ]]; then
                files+=("atp_matches_qual_chall_${year}.csv" "atp_matches_futures_${year}.csv")
              else
                files+=("wta_matches_qual_itf_${year}.csv")
              fi
              for file in "${files[@]}"; do
                url="https://raw.githubusercontent.com/Aneeshers/tennis-sackmann-archive/main/${tour}/${file}"
                curl --fail --location --retry 2 --user-agent "TennisValueScanner-Aggregator1-Research/1.0" \
                  "$url" --output "$ROOT/sackmann/$file"
                test -s "$ROOT/sackmann/$file"
              done
            done
          done
          for registry in atp_players.csv wta_players.csv; do
            tour="${registry%%_*}"
            url="https://raw.githubusercontent.com/Aneeshers/tennis-sackmann-archive/main/${tour}/${registry}"
            curl --fail --location --retry 2 --user-agent "TennisValueScanner-Aggregator1-Research/1.0" \
              "$url" --output "$ROOT/sackmann/$registry"
            test -s "$ROOT/sackmann/$registry"
          done
          {
            echo "Downloaded at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Valuebetennis source: https://www.valuebetennis.com/donnees.htm"
            echo "Sackmann mirror: https://github.com/Aneeshers/tennis-sackmann-archive"
            echo
            echo "File checksums (raw datasets are not included in this artifact):"
            sha256sum "$ROOT"/valuebetennis/*.csv "$ROOT"/sackmann/*.csv
          } > audit-output/source-manifest.txt
          echo "Downloaded $(find "$ROOT/valuebetennis" -name '*.csv' | wc -l) Valuebetennis files and $(find "$ROOT/sackmann" -name '*.csv' | wc -l) Sackmann files."

      - name: Run Valuebetennis duplicate audit
        shell: bash
        run: |
          node scripts/aggregator1-duplicate-audit.mjs \
            --valuebet-dir "$RUNNER_TEMP/aggregator1/valuebetennis" \
            --out audit-output/aggregator1-duplicate-audit.json

      - name: Run full aggregate linkage audit
        shell: bash
        run: |
          DATE_WINDOW="${{ inputs.date_window }}"
          if [[ -z "$DATE_WINDOW" ]]; then DATE_WINDOW=14; fi
          node scripts/aggregator1-linkage-audit.mjs \
            --valuebet-dir "$RUNNER_TEMP/aggregator1/valuebetennis" \
            --sackmann-dir "$RUNNER_TEMP/aggregator1/sackmann" \
            --date-window "$DATE_WINDOW" \
            --out audit-output/aggregator1-linkage-audit.json
          node scripts/aggregator1-player-id-audit.mjs \
            --valuebet-dir "$RUNNER_TEMP/aggregator1/valuebetennis" \
            --sackmann-dir "$RUNNER_TEMP/aggregator1/sackmann" \
            --out audit-output/aggregator1-player-id-audit.json

      - name: Validate aggregate report
        run: |
                    node -e 'const r=require("./audit-output/aggregator1-linkage-audit.json"); const p=require("./audit-output/aggregator1-player-id-audit.json"); const d=require("./audit-output/aggregator1-duplicate-audit.json"); if(r.schemaVersion!==2 || !r.totals || !r.byTour || !r.byYear || !r.byCategory || !r.byTourCategory || !r.playerIdEvidence || !r.playerIdComparison || !r.valuebetSchema || p.schemaVersion!==1 || !p.byTour || d.schemaVersion!==1 || !d.totals) process.exit(1); console.log(JSON.stringify({linkage:{totals:r.totals,byTour:r.byTour,playerIdEvidence:r.playerIdEvidence,playerIdComparison:r.playerIdComparison,byCategory:r.byCategory,byTourCategory:r.byTourCategory,byYear:r.byYear,sackmannSourceRows:r.sources.sackmannSourceRows,sackmannSourceRowsByYear:r.sources.sackmannSourceRowsByYear},playerIdCrosswalk:p,duplicateAudit:{totals:d.totals,byYear:d.byYear,byTour:d.byTour}},null,2));'

      - name: Upload aggregate report only
        uses: actions/upload-artifact@v4
        with:
          name: aggregator1-full-audit-report
          path: audit-output/
          if-no-files-found: error
          retention-days: 14
