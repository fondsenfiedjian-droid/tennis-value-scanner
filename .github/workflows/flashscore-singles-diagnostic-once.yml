name: One-time Flashscore Singles Diagnostic

on:
  push:
    branches:
      - diagnostic/flashscore-singles-once-20261125

permissions:
  contents: read

concurrency:
  group: flashscore-singles-diagnostic-once
  cancel-in-progress: false

jobs:
  run-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out isolated diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diagnostic/flashscore-singles-once-20261125

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy isolated Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.165.0 deploy --config wrangler.preview.toml

      - name: Install temporary one-time trigger credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "DIAGNOSTIC_TOKEN=$token" >> "$GITHUB_ENV"
          printf '%s' "$token" | npx --yes wrangler@4.165.0 secret put DIAGNOSTIC_TRIGGER_TOKEN --config wrangler.preview.toml

      - name: Start the capped singles-only Apify test
        id: start
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $DIAGNOSTIC_TOKEN" \
            "https://tennis-value-api-preview.fonds-enfiedjian.workers.dev/__diagnostic/flashscore-singles/start")"
          echo "$response" | jq .
          run_id="$(echo "$response" | jq -r '.runId')"
          test -n "$run_id"
          test "$run_id" != "null"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for run and retrieve dataset
        env:
          RUN_ID: ${{ steps.start.outputs.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $DIAGNOSTIC_TOKEN" \
              "https://tennis-value-api-preview.fonds-enfiedjian.workers.dev/__diagnostic/flashscore-singles/status?runId=$RUN_ID")"
            status="$(echo "$response" | jq -r '.status // "UNKNOWN"')"
            echo "Apify run status: $status (poll $attempt/90)"
            if [ "$status" = "SUCCEEDED" ]; then
              printf '%s\n' "$response" > flashscore-singles-diagnostic.json
              echo "$response" | jq '{status,runId,itemCount,run:{startedAt:.run.startedAt,finishedAt:.run.finishedAt,stats:.run.stats},sample:(.items[:8])}'
              node --input-type=module <<'NODE'
              import fs from 'node:fs';
              const report = JSON.parse(fs.readFileSync('flashscore-singles-diagnostic.json', 'utf8'));
              const rows = Array.isArray(report.items) ? report.items : [];
              const matches = rows.filter(r => r && r.isDoubles !== true && !/doubles|team|cup tie/i.test(String(r.category || '')));
              const findWinamax = value => {
                if (!value || typeof value !== 'object') return false;
                if (Array.isArray(value)) return value.some(findWinamax);
                return Object.entries(value).some(([k,v]) => /winamax/i.test(String(k)) || (typeof v === 'string' && /winamax/i.test(v)) || findWinamax(v));
              };
              const winamax = matches.filter(findWinamax);
              console.log(JSON.stringify({
                totalRows: rows.length,
                singlesLikeRows: matches.length,
                rowsWithWinamaxMention: winamax.length,
                categories: [...new Set(matches.map(r => r.category).filter(Boolean))],
                sampleWinamaxRows: winamax.slice(0, 5),
                sampleSingles: matches.slice(0, 5)
              }, null, 2));
              NODE
              exit 0
            fi
            case "$status" in
              FAILED|ABORTED|TIMED-OUT) echo "$response" | jq .; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out while waiting for Apify run $RUN_ID"
          exit 1

      - name: Upload diagnostic dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flashscore-singles-diagnostic
          path: flashscore-singles-diagnostic.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Remove temporary trigger credential
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${DIAGNOSTIC_TOKEN:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            yes | npx --yes wrangler@4.165.0 secret delete DIAGNOSTIC_TRIGGER_TOKEN --config wrangler.preview.toml || true
          fi
