name: Build Developer Preview APK

on:
  push:
    branches:
      - integration/tvs2-pro-api
    paths:
      - 'android/**'
      - '.github/workflows/build-developer-preview-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: integration/tvs2-pro-api

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tennis-value-scanner-developer-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest preview APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: developer-preview-latest
          name: Tennis Value Scanner — Developer Preview APK
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Android installation package for the isolated TVS Developer Preview.
            Loads the Netlify Deploy Preview for PR #172 and uses the Preview API.
            This is a debug-signed preview build, not a production Play Store release.
