name: Project state documentation guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-project-state-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require project state update for implementation changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          echo "Changed files:"
          printf '%s\n' "$changed"
          if ! printf '%s\n' "$changed" | grep -qx 'PROJECT_STATE.md'; then
            implementation_changes="$(printf '%s\n' "$changed" | grep -Ev '^(PROJECT_STATE\.md|README\.md|.*\.md|LICENSE|NOTICE)$' || true)"
            if [ -n "$implementation_changes" ]; then
              echo "::error::Implementation/configuration changes require an accompanying PROJECT_STATE.md update in the same pull request."
              echo "$implementation_changes"
              exit 1
            fi
          fi
          echo "Project state documentation requirement satisfied."
