name: TVS 2.0 Live Tennis PRO historical research (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tvs2-pro-history-research
  cancel-in-progress: false

jobs:
  archive-research:
    if: github.ref == 'refs/heads/integration/tvs2-pro-api'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out selected research branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set Preview history download token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare Preview credentials are required for protected history downloads"
            exit 1
          fi
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$token"
          printf '%s' "$token" | npx --yes wrangler@4.165.0 secret put TVS_RESEARCH_ACCESS_TOKEN --config wrangler.preview.toml
          echo "TVS_RESEARCH_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Download licensed Live Tennis archive packages to ephemeral runner
        env:
          PREVIEW_WORKER_URL: https://tennis-value-api-preview.fonds-enfiedjian.workers.dev
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from "node:fs/promises";
          import { createHash } from "node:crypto";
          import { join } from "node:path";
          const base = process.env.PREVIEW_WORKER_URL;
          const dir = "/tmp/livetennis-pro-archive";
          await mkdir(dir, { recursive: true });
          async function readJson(path) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(30000) });
            let body = {};
            try { body = await response.json(); } catch {}
            if (!response.ok) throw new Error(path + " returned HTTP " + response.status + ": " + JSON.stringify(body).slice(0, 300));
            return body;
          }
          const inventory = await readJson("/history/packages?kind=archive");
          if (!Array.isArray(inventory.data) || inventory.data.length === 0) {
            throw new Error("The Live Tennis archive package inventory is empty");
          }
          const packages = inventory.data.filter(item => /^\d{4}$/.test(String(item.period)) &&
            Number(item.period) >= 1968 && Number(item.period) <= 2022);
          if (packages.length < 40) {
            throw new Error("Archive coverage unexpectedly short: " + packages.length + " yearly packages");
          }
          let totalMatches = 0, totalBytes = 0, downloaded = 0;
          for (const item of packages.sort((a, b) => Number(a.period) - Number(b.period))) {
            const manifest = await readJson("/history/packages/" + encodeURIComponent(item.period) + "?kind=archive");
            const file = manifest.files?.find(candidate => candidate.format === "csv");
            if (!file) throw new Error("No CSV file in archive manifest for " + item.period);
            const response = await fetch(base + "/history/packages/" + encodeURIComponent(item.period) +
              "?kind=archive&format=csv", {
                headers: { "X-Research-Access": process.env.TVS_RESEARCH_ACCESS_TOKEN || "" },
                signal: AbortSignal.timeout(60000)
              });
            if (!response.ok) {
              const error = await response.text();
              throw new Error("Archive download " + item.period + " failed HTTP " + response.status + ": " + error.slice(0, 300));
            }
            const bytes = Buffer.from(await response.arrayBuffer());
            if (bytes.length !== Number(file.bytes)) {
              throw new Error("Byte count mismatch for " + item.period + ": " + bytes.length + " vs " + file.bytes);
            }
            const sha = createHash("sha256").update(bytes).digest("hex");
            if (sha !== file.sha256) throw new Error("SHA-256 mismatch for archive year " + item.period);
            if (file.compression === "gzip" && !(bytes[0] === 0x1f && bytes[1] === 0x8b)) {
              throw new Error("Gzip signature mismatch for archive year " + item.period);
            }
            await writeFile(join(dir, item.period + ".csv.gz"), bytes);
            totalMatches += Number(manifest.match_count || item.match_count || 0);
            totalBytes += bytes.length;
            downloaded++;
            if (downloaded % 10 === 0 || downloaded === packages.length) {
              console.log("Downloaded " + downloaded + "/" + packages.length + " years; matches=" +
                totalMatches + "; compressed MiB=" + (totalBytes / 1048576).toFixed(1));
            }
          }
          await writeFile(join(dir, "inventory.json"), JSON.stringify({
            source: "Live Tennis API PRO /history/packages?kind=archive",
            periods: packages.map(item => item.period),
            downloadedYears: downloaded,
            manifestMatchCount: totalMatches,
            compressedBytes: totalBytes,
            inventoryAsOf: new Date().toISOString()
          }, null, 2));
          console.log("Verified archive download complete: years=" + downloaded +
            "; manifest matches=" + totalMatches + "; compressed MiB=" + (totalBytes / 1048576).toFixed(1) + ".");
          NODE
      - name: Run chronological ATP and WTA rank-age experiments
        run: node scripts/livetennis-pro-rank-age-research.mjs /tmp/livetennis-pro-archive /tmp/livetennis-pro-rank-age-report.json
      # Raw licensed source packages remain on the ephemeral runner and are never uploaded.
      - name: Run rolling serve-return experiments from prior matches
        run: node scripts/livetennis-pro-serve-return-research.mjs /tmp/livetennis-pro-archive /tmp/livetennis-pro-serve-return-report.json
      - name: Upload aggregate serve-return research report only
        uses: actions/upload-artifact@v4
        with:
          name: livetennis-pro-serve-return-research
          path: /tmp/livetennis-pro-serve-return-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload aggregate research report only
        uses: actions/upload-artifact@v4
        with:
          name: livetennis-pro-rank-age-research
          path: /tmp/livetennis-pro-rank-age-report.json
          if-no-files-found: error
          retention-days: 30
