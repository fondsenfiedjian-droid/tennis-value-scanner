name: Build Preview Android APK

on:
  push:
    branches:
      - ui/tennis-value-scanner-2
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-preview-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Preview branch
        uses: actions/checkout@v4
        with:
          ref: ui/tennis-value-scanner-2
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        working-directory: android-wrapper
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk Tennis-Value-Scanner-Preview.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tennis-Value-Scanner-Preview-APK
          path: Tennis-Value-Scanner-Preview.apk
          if-no-files-found: error
          retention-days: 30
