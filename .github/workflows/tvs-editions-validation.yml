name: TVS Editions Validation
on:
  push:
    branches:
      - feature/tvs2-editions-lab
  pull_request:
    branches:
      - release/tennis-value-scanner-2-prep
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run regression suite
        run: node --test tests/*.test.mjs
