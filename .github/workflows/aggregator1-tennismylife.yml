name: Aggregator 1 TennisMyLife ATP audit

on:
  push:
    branches:
      - research/aggregator1-linkage-audit
    paths:
      - '.github/workflows/aggregator1-tennismylife.yml'
      - 'scripts/aggregator1-tennismylife-audit.mjs'
      - 'scripts/test-aggregator1-tennismylife-audit.mjs'
      - 'scripts/aggregator1-valuebet-id-bridge.mjs'
      - 'scripts/test-aggregator1-valuebet-id-bridge.mjs'
  workflow_dispatch:
    inputs:
      date_window:
        description: "Maximum date difference in days"
        required: true
        default: "14"
        type: string

permissions:
  contents: read

jobs:
  tennismylife-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/aggregator1-linkage-audit

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check and run synthetic fixture
        run: |
          node --check scripts/aggregator1-tennismylife-audit.mjs
          node --check scripts/test-aggregator1-tennismylife-audit.mjs
          node --check scripts/aggregator1-valuebet-id-bridge.mjs
          node --check scripts/test-aggregator1-valuebet-id-bridge.mjs
          node scripts/test-aggregator1-tennismylife-audit.mjs
          node scripts/test-aggregator1-valuebet-id-bridge.mjs

      - name: Download TennisMyLife ATP and Sackmann datasets
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/aggregator1-tnm"
          mkdir -p "$ROOT/tml" "$ROOT/sackmann" "$ROOT/valuebetennis" audit-output
          for year in 2021 2022 2023 2024 2025; do
            file="valuebetennis-matchs-$year.csv"
            curl --fail --location --retry 2 --user-agent "TennisValueScanner-Aggregator1-Research/1.0" \
              "https://www.valuebetennis.com/datasets/$file" --output "$ROOT/valuebetennis/$file"
            test -s "$ROOT/valuebetennis/$file"
            curl --fail --location --retry 2 --user-agent "TennisValueScanner-Aggregator1-Research/1.0" \
              "https://raw.githubusercontent.com/Tennismylife/TML-Database/master/$year.csv" \
              --output "$ROOT/tml/$year.csv"
            test -s "$ROOT/tml/$year.csv"
            curl --fail --location --retry 2 --user-agent "TennisValueScanner-Aggregator1-Research/1.0" \
              "https://raw.githubusercontent.com/Aneeshers/tennis-sackmann-archive/main/atp/atp_matches_$year.csv" \
              --output "$ROOT/sackmann/atp_matches_$year.csv"
            test -s "$ROOT/sackmann/atp_matches_$year.csv"
          done
          curl --fail --location --retry 2 --user-agent "TennisValueScanner-Aggregator1-Research/1.0" \
            "https://raw.githubusercontent.com/Tennismylife/TML-Database/master/ATP_Database.csv" \
            --output "$ROOT/ATP_Database.csv"
          test -s "$ROOT/ATP_Database.csv"
          {
            echo "Downloaded at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "TennisMyLife source: https://stats.tennismylife.org/tennis-match-database"
            echo "TennisMyLife repository: https://github.com/Tennismylife/TML-Database"
            echo "Sackmann mirror: https://github.com/Aneeshers/tennis-sackmann-archive"
            echo
            echo "File checksums (raw datasets are not included in this artifact):"
            sha256sum "$ROOT"/tml/*.csv "$ROOT"/sackmann/*.csv "$ROOT"/ATP_Database.csv
          } > audit-output/tennismylife-source-manifest.txt

      - name: Run aggregate TennisMyLife and player-ID audit
        shell: bash
        run: |
          DATE_WINDOW="${{ inputs.date_window }}"
          if [[ -z "$DATE_WINDOW" ]]; then DATE_WINDOW=14; fi
          node scripts/aggregator1-tennismylife-audit.mjs \
            --tml-dir "$RUNNER_TEMP/aggregator1-tnm/tml" \
            --sackmann-dir "$RUNNER_TEMP/aggregator1-tnm/sackmann" \
            --registry "$RUNNER_TEMP/aggregator1-tnm/ATP_Database.csv" \
            --date-window "$DATE_WINDOW" \
            --out audit-output/aggregator1-tennismylife-audit.json

      - name: Test Valuebetennis linkage through TennisMyLife IDs
        shell: bash
        run: |
          DATE_WINDOW="${{ inputs.date_window }}"
          if [[ -z "$DATE_WINDOW" ]]; then DATE_WINDOW=14; fi
          node scripts/aggregator1-valuebet-id-bridge.mjs \
            --valuebet-dir "$RUNNER_TEMP/aggregator1-tnm/valuebetennis" \
            --tml-dir "$RUNNER_TEMP/aggregator1-tnm/tml" \
            --sackmann-dir "$RUNNER_TEMP/aggregator1-tnm/sackmann" \
            --registry "$RUNNER_TEMP/aggregator1-tnm/ATP_Database.csv" \
            --date-window "$DATE_WINDOW" \
            --out audit-output/aggregator1-valuebet-id-bridge.json

      - name: Validate aggregate reports
        run: |
          node -e "const a=require('./audit-output/aggregator1-tennismylife-audit.json'); const b=require('./audit-output/aggregator1-valuebet-id-bridge.json'); if(a.schemaVersion!==1 || !a.totals || !a.byYear || b.schemaVersion!==1 || !b.totals || !b.byYear) process.exit(1); console.log('TML audit:', JSON.stringify(a.totals)); console.log('ID bridge:', JSON.stringify(b.totals));"

      - name: Upload aggregate report only
        uses: actions/upload-artifact@v4
        with:
          name: aggregator1-tennismylife-report
          path: audit-output/
          if-no-files-found: error
          retention-days: 14
