name: Regression tests

on:
  push:
    branches: [main, ui/tennis-value-scanner-2, integration/live-tennis-pro-markets]
  pull_request:
    branches: [main, ui/tennis-value-scanner-2]

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit Preview Winamax-to-match linkage
        if: github.ref == 'refs/heads/ui/tennis-value-scanner-2' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        env:
          APP_URL: https://deploy-preview-167--fascinating-paprenjak-1aa9b3.netlify.app
          API_URL: https://tennis-value-api-preview.fonds-enfiedjian.workers.dev
        run: node scripts/preview-odds-matching-audit.mjs
      - name: Run regression tests
        run: node --test tests/*.test.mjs
