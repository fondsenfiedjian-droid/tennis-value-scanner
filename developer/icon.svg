<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="feltBase" cx="32%" cy="24%" r="78%">
      <stop offset="0" stop-color="#eaff9a"/>
      <stop offset=".38" stop-color="#d5ed62"/>
      <stop offset=".76" stop-color="#c1df42"/>
      <stop offset="1" stop-color="#8eae24"/>
    </radialGradient>
    <radialGradient id="light" cx="27%" cy="19%" r="78%">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".48" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#263900" stop-opacity=".23"/>
    </radialGradient>
    <filter id="feltTexture" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".92" numOctaves="3" seed="21" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="fine">
        <feFuncA type="table" tableValues="0 .18"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="fine" mode="soft-light"/>
    </filter>
    <clipPath id="roundBall"><circle cx="256" cy="256" r="250"/></clipPath>
  </defs>

  <!-- A single natural tennis ball; everything outside the circular silhouette is transparent. -->
  <g clip-path="url(#roundBall)">
    <circle cx="256" cy="256" r="250" fill="url(#feltBase)" filter="url(#feltTexture)"/>
    <circle cx="256" cy="256" r="250" fill="url(#light)"/>

    <path d="M -18 93 C 111 119 183 188 191 257 C 199 326 139 393 17 421"
          fill="none" stroke="#879e31" stroke-width="23" stroke-linecap="round" opacity=".38"/>
    <path d="M -18 93 C 111 119 183 188 191 257 C 199 326 139 393 17 421"
          fill="none" stroke="#f8ffd9" stroke-width="16" stroke-linecap="round"/>
    <path d="M -18 93 C 111 119 183 188 191 257 C 199 326 139 393 17 421"
          fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".72"/>

    <path d="M 530 93 C 401 119 329 188 321 257 C 313 326 373 393 495 421"
          fill="none" stroke="#879e31" stroke-width="23" stroke-linecap="round" opacity=".38"/>
    <path d="M 530 93 C 401 119 329 188 321 257 C 313 326 373 393 495 421"
          fill="none" stroke="#f8ffd9" stroke-width="16" stroke-linecap="round"/>
    <path d="M 530 93 C 401 119 329 188 321 257 C 313 326 373 393 495 421"
          fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".72"/>
  </g>
  <g aria-label="Developer edition"><rect x="328" y="22" width="164" height="72" rx="22" fill="#0b2233" stroke="#55dff2" stroke-width="8"/><text x="410" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="#8cecff">DEV</text></g>
</svg>
